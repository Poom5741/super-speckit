schema_version: "1.0"
workflow:
  id: "super-speckit"
  name: "Super-SpecKit evidence-first delivery"
  version: "0.1.0"
  author: "super-speckit"
  description: "Runs autonomous Spec Kit SDD with feedback loops, independent QA, and evidence-gated merge"
requires:
  speckit_version: ">=0.8.5"
inputs:
  feature:
    type: string
    required: true
    prompt: "Feature request or feature ID"
  ui_change:
    type: boolean
    default: false
    prompt: "Does this change alter a user-facing interface?"
steps:
  - id: assess
    type: prompt
    message: "Run ask-super-speckit for '{{ inputs.feature }}'. Autonomously inspect evidence, choose the next stage, and continue until delivered or truthfully blocked."
  - id: purpose-gate
    type: prompt
    message: "Run super-speckit.purpose-gate. Draft a visual Purpose Map from the request, then obtain one human confirmation of outcome, affected people, success signal, and non-goals. Do not ask the human to make technical decisions."
  - id: specify
    command: speckit.specify
    input:
      args: "{{ inputs.feature }}"
  - id: clarify
    command: speckit.clarify
    input:
      args: "{{ inputs.feature }}"
  - id: spec-grill
    type: prompt
    message: "Run super-speckit.spec-grill after purpose confirmation. Use independent Builder, Examiner, Investigator, and Resolver roles; link evidence and label every material answer proven, inferred, assumed, or unknown. Return to Purpose Gate only for a purpose-level conflict."
  - id: route-and-understand
    type: prompt
    message: "Run super-speckit.route and super-speckit.atlas. Choose micro, normal, or milestone from repository evidence; generate the Project Atlas and a diagram-first Change Story. Treat unknowns as unknowns, not architecture facts."
  - id: design
    type: if
    condition: "{{ inputs.ui_change }}"
    then:
      - id: design-first
        type: prompt
        message: "Run super-speckit.design-first for this feature. Create the design brief, static HTML prototype, and design decision artifact."
      - id: design-decision
        type: prompt
        message: "Autonomously evaluate the HTML design artifact against the spec, design system, accessibility baseline, and evidence. Record the selected direction and continue."
  - id: plan
    command: speckit.plan
    input:
      args: "{{ inputs.feature }}"
  - id: tasks
    command: speckit.tasks
    input:
      args: "{{ inputs.feature }}"
  - id: analyze
    command: speckit.analyze
    input:
      args: "{{ inputs.feature }}"
  - id: lane-plan
    type: prompt
    message: "Run super-speckit.parallelize, super-speckit.matrix, and super-speckit.phase-check. Do not create worktrees until the dependency, risk, and phase-contract evidence is recorded."
  - id: feedback-loop
    type: prompt
    message: "Run super-speckit.feedback-loop. Find and run the cheapest real public-seam feedback loop before implementation; record baseline, assertion, and limits."
  - id: implement-and-verify
    type: prompt
    message: "Use super-speckit.start, then verify the immutable candidate in a clean QA worktree. Run environment-ready, policy-selected gates, runtime QA, OCR triage, and defect/retest loops. For UI changes, prepare the default private-browser Rakazo assignment with super-speckit.rakazo-journey, then run super-speckit.journey-ux and rerun its full declared journey set after every confirmed UX fix. Produce a proof pack."
  - id: release
    type: prompt
    message: "Run super-speckit.release. Autonomously merge only if every configured evidence gate passes; otherwise self-heal through diagnosis, fix, and independent retest."
  - id: handoff
    type: prompt
    message: "Write a super-speckit.handoff with factual evidence, next safe action, and any blocker/resume condition before convergence. For any local/cloud or agent transfer, use super-speckit.transfer with immutable SHA, state receipt, attempt ID, and resume verification."
  - id: converge
    command: speckit.converge
    input:
      args: "{{ inputs.feature }}"
