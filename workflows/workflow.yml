schema_version: "1.0"
workflow:
  id: "super-speckit"
  name: "Super-SpecKit evidence-first delivery"
  version: "0.2.0"
  author: "super-speckit"
  description: "One pipeline: native Spec Kit planning/convergence, feature-specific Lude personas, PStack methods, independent QA and evidence-gated merge"
requires:
  speckit_version: ">=0.8.5"
inputs:
  feature:
    type: string
    required: true
    prompt: "Feature request or feature ID"
  ui_change:
    type: boolean
    default: false
    prompt: "Does this change alter a user-facing interface?"
steps:
  - id: discipline-gates
    type: prompt
    message: "New feature records default to gates_contract=discipline-v1. Two gates are enforced by scripts/discipline_contract.py in every harness before maker work, new candidates and release: (1) learning-checkpoint — pinned VibeWise method; the human reasons through approach and design and explicitly authorizes implementation (or the purpose-confirming human records an explicit decline with reason); (2) goldfish-review — pinned Elephant/Goldfish egm-review protocol; at least the configured minimum of fresh zero-context reviewers examine only the current spec.md (normal/milestone) or playbook.md (micro) with digest-bound findings and resolution. When the harness can spawn subagents every goldfish reviewer must dispatch as a fresh subagent; a same-context review is rejected. Load sources through scripts/vibe_wise_adapter.py and scripts/egm_adapter.py with their adapter contracts; never install their plugins or run them as a second coordinator. Record receipts via record-prerequisite learning-checkpoint / goldfish-review."
  - id: unified-contract
    type: prompt
    message: "Read skills/ask-super-speckit/references/unified-pipeline.md and adapters/lude-kit/override-contract.md. Use one Super-SpecKit coordinator: native Spec Kit intent/convergence, feature-specific Lude maker persona and specialists, PStack engineering methods, independent exact-candidate QA, separate reconciled PStack/Lude lenses. New feature records default to unified-v1. Run and record convergence before release/merge; remaining tasks return to implement and require a new candidate with fresh independent QA, both lenses and convergence. Compact completion is labeled separately. Do not activate upstream coordinators or global installers."
  - id: playbook-delivery
    type: prompt
    message: "Run ask-super-speckit for '{{ inputs.feature }}'. Read the playbook-delivery contract. Select PStack first and investigate actual flow, conventions and applicable lessons before selecting planning depth; micro features/fixes use a persisted playbook, matrix and shared views, normal/milestone uses native Spec Kit. Record purpose-gate from actual user confirmation; run spec-grill for normal/milestone scope. Preserve confirmed purpose, research actual structure and primary guidance, record executable architecture constraints, use one code-writing checkout, and verify the exact candidate independently in a QA clone. Require real user journeys and engineering review. Persist long-run predicate, steps, authority, budget and checkpoints; observe a supported runner before promising unattended resume. Continue through diagnosis/fix/retest until complete or truthfully blocked. Use Archify for Atlas, Change Story and evolving Bug Story, with explicit fallback limitations. Require knowledge-v2 investigation, convention reconciliation, completed source steps, exact-candidate shared result, independently verified bug resolution and scoped prevention receipts. Release only within configured authority and retain evidence."
