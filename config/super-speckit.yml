version: 1
delivery:
  coordinator: pstack-playbook
  planning: scope-selected-speckit
  maker_checkout: current-single-writer
  qa_checkout: standalone-clone
  require_research_receipt: true
  require_architecture_receipt: true
  require_independent_engineering_review: true
  unattended_runner: "" # capability must be configured and observed before promising resume
worktrees:
  root: ../.super-speckit-worktrees
  feature_prefix: ss/feature/
  bug_prefix: ss/bug/
  qa_prefix: ss/qa/
  retain_failed_qa_worktrees: false
roles:
  require_distinct_maker_and_checker: true
  merge_requires_human: false
orchestration:
  entry_command: ask-super-speckit
  max_parallel_lanes: 3
  max_heavy_processes: 2
  max_repair_cycles: 3
  max_retries_without_new_evidence: 1
  protected_paths: ["auth/**", "payments/**", "migrations/**", "infra/**", ".github/workflows/**", "**/.env*", "**/*secret*", "**/*credential*"]
  human_approval_for_risk: []
  autonomous_execution: true
  phase_contract_required: true
  plan_quality_check_required: true
  durable_handoff_required_on_pause: true
  milestone_audit_required: true
  research_before_high_risk: true
  tdd_when_feasible: true
  feedback_loop_required: true
  purpose_gate_required: true
  spec_grill_required: true
  project_atlas_required: true
  change_story_required: true
  scope_route_required: true
  reassess_after_verified_milestone_slice: true
  decision_trail_required_for_long_runs: true
  purpose_gate_human_scope: [outcome, affected_people, success_signal, non_goals]
  purpose_gate_human_technical_decisions: false
ponytail:
  enabled: true
  default_intensity: full
  apply_to: [maker, bug-fix, refactor]
  allowed_intensities_for_protected_paths: [lite, full]
  require_decision_trail_note: true
  never_simplify: [requirements, security, privacy, trust-boundary-validation, data-loss-protection, accessibility, migration-safety, verification]
omp_team:
  enabled_when_omp_detected: true
  mode: adaptive # use a team only when independent work exceeds coordination cost
  max_workers: 3
  worker_timeout_minutes: 30
  supervisor_continues_control_plane: true
  allowed_roles: [atlas-scout, contract-scout, test-designer, maker, static-reviewer, qa-planner]
  maker_requires_isolated_worktree: false # sequence writers; parallel writers need separate checkouts
  checker_must_be_independent: true
  parent_must_not_block_on_background_workers: true
  cancellation_on_stall: true
state_evidence:
  source_of_truth: yaml-json-files-and-commands
  work_state_manifest: .super-speckit/state/work-state.yml
  require_pre_stage_check: true
  require_post_stage_check: true
  status_command: "python3 scripts/super_speckit.py status --repo . --feature {{feature}} --strict"
  validation_command: "python3 scripts/super_speckit.py validate --repo ."
  inconclusive_is_not_pass: true
delegation:
  enabled: false # explicit opt-in; never silently send repository context to a cloud service
  default_transport: codex-cloud
  codex_cloud_environment_id: "" # required for `codex cloud exec --env ...`
  allowed_roles: [research, maker, bug-fix]
  forbidden_roles: [release-approver]
  require_committed_base: true
  require_redacted_handoff: true
  require_independent_retest_after_apply: true
  centillex_desk_command: "" # optional, e.g. `desk`; configured separately after local verification
continuation:
  path: .super-speckit/continuation.yml
  update_after_material_stage: true
  require_git_pull_before_resume: true
  require_strict_state_check_before_resume: true
  history_limit: 20
design:
  required_when_paths: ["**/*.tsx", "**/*.jsx", "**/*.vue", "**/*.svelte", "**/*.html", "**/*.css"]
  output_root: .super-speckit/design
  design_system_sources: [] # local DESIGN.md, Figma export, or token file; never invent a brand system
  optional_adapters: [html, v0, stitch, claude-design]
  require_decision_before_implementation: true
  accessibility_baseline: "WCAG 2.2 AA"
risk:
  default: medium
  critical_paths: ["auth/**", "payments/**", "migrations/**", "data-deletion/**"]
  high_requires: ["independent-runtime-qa", "security-review"]
gates:
  format: ""
  lint: ""
  unit: ""
  integration: ""
  build: ""
  architecture: ""
  types: ""
  app_start: ""
  app_url: "http://127.0.0.1:3000"
  playwright: "npx playwright test"
  api_assertions: ""
  db_assertions: ""
  ocr_review: "" # adapter command; writes an OCR findings artifact, never a pass verdict
qa:
  clean_environment: true
  fixture_reset_command: ""
  isolated_test_namespace: "ss-{{run_id}}"
  reproduction_attempts: 2
  exploration_timebox_minutes: 20
  redact_patterns: ["(?i)authorization:.*", "(?i)password=[^&\\s]+", "(?i)api[_-]?key[=:][^\\s]+"]
  readiness_checks: [] # health endpoint, migration status, fixture reset, namespace allocation
  correlation_header: "X-Super-Speckit-Run"
verification_harness:
  required_before_runtime_qa: true
  root: .super-speckit/verification
  require_feature_map: true
  require_live_smoke: true
  require_cleanup_receipt: true
  refresh_after_route_or_runtime_drift: true
static_review_panel:
  enabled: true
  lenses: [correctness, architecture, security, maintainability]
  ui_lenses: [ux-accessibility]
  reviewer_count: 3
  must_not_satisfy_runtime_matrix_rows: true
  must_not_auto_apply_findings: true
continuous_improvement:
  enabled: true
  repeated_failure_threshold: 2
  enforcement_order: [architecture, type-schema, lint-static, ci, regression-test, documentation]
  require_historical_counterexample: true
skill_evaluation:
  enabled: true
  mode: independent-forward-test
  subagent_command: "" # optional reviewed host adapter; never infer a subagent API
  workspace_root: .super-speckit/evals
  allow_network: false
  allow_external_mutations: false
  retain_failed_runs: true
  require_observed_artifacts: true
journey_ux:
  required_for_ui_changes: true
  mode: agent-led-manual-browser
  require_real_running_app: true
  rerun_full_declared_set_after_fix: true
  capture: [screenshot, trace, video, sanitized-logs]
  required_coverage: [primary, validation-recovery, empty-loading-error, authorization, persistence, responsive, keyboard]
  no_release_with_confirmed_defect: true
  no_release_with_blocked_journey: true
manual_journey_agent:
  provider: rakazo
  enabled: true
  mode: persistent-browser-reviewer
  rakazo:
    # Optional bootstrap values; otherwise ask on first test use and remember in the local QA session.
    instance_url: ""
    bot_url: ""
    # Set only to a reviewed, project-local adapter. Super-SpecKit never guesses a Rakazo API or CLI.
    dispatch_command: ""
    require_private_computer: true
    require_clean_browser_profile: true
    allow_shared_computer: false
    allow_peer_delegation: false
    require_live_model: true
    task_timeout_minutes: 45
    report_root: .super-speckit/qa
evidence:
  root: .super-speckit/qa
  retain_on_pass_days: 14
  retain_on_failure_days: 90
  proof_pack_manifest: proof-pack.json
  require_candidate_sha: true
  require_environment_receipt: true
merge:
  required_gate_status: pass
  require_ocr_triage_complete: true
  require_no_open_confirmed_bugs: true
  autonomous_when_ready: true
pstack:
  enabled: true
  revision: e5a8186d7b43be8d6ac4452440fbead5f1a51c70
  source_root: vendor/pstack
  routes: adapters/pstack/routes.json
  override_contract: adapters/pstack/override-contract.md
  resource_policy: adaptive-rigor
  primary_host: zcode
  cli_hosts: [codex, pi]
  optional_hosts: [omp, cursor]
  model_policy: configured-or-inherited
  fallback: separately-scoped-sequential-workers
  interrogation_protocol: identical-prompt
  comment_policy: review-then-selective-edits
  architecture_reassessment_deviations: 2
  benchmark_min_samples_per_side: 5
  automation_enabled: false
  source_upgrade_policy: deliberate-pinned-revision
